function update(dt){if(!playing)return;const activelyPedaling=mode==='bike'?(!!device&&bikeSpeed>1&&performance.now()-lastBikeDataAt<5000):pressed;let target=mode==='bike'?(activelyPedaling?bikeSpeed:0):(pressed?29:0);speed+=(target-speed)*Math.min(1,dt*3.2);if(mode==='bike'&&activelyPedaling)maxWorkoutSpeed=Math.max(maxWorkoutSpeed,speed);scroll+=speed*dt*13;updateRoadCoins(dt);const targetCadence=speed<0.7?0:Math.min(14,Math.max(2.5,speed*.46));animationCadence+=(targetCadence-animationCadence)*Math.min(1,dt*3.8);if(animationCadence>0.1)pedalPhase=(pedalPhase+animationCadence*dt)%4;const moved=speed*dt/3.6;meters+=moved;if(activelyPedaling)elapsed+=dt;points=Math.floor(meters/10);if(mode==='bike'&&activelyPedaling){const intensityMET=EFFORT_MET[effortLevel];calories+=Math.max(0,intensityMET-1)*3.5*CALORIE_WEIGHT_KG/200*dt/60}if(mode==='bike'){const totalDistanceCoins=Math.floor(meters/100);if(totalDistanceCoins>earnedDistance){progress.coins+=totalDistanceCoins-earnedDistance;earnedDistance=totalDistanceCoins;saveProgress()}if(meters>progress.best){progress.best=meters;saveProgress()}if(!recordAwarded&&meters>=startingBest+100&&meters>=100){recordAwarded=true;progress.coins+=25;sfx('record');saveProgress()}if(!goalAwarded&&elapsed>=600){goalAwarded=true;progress.coins+=50;sfx('goal');saveProgress()}}refreshRewards();el('speed').textContent=speed.toFixed(1)+' KM/H';el('distance').textContent=Math.round(meters)+' M';el('score').textContent='★ '+points}

 const cx=220,cy=194,label=speed.toFixed(1)+' KM/H',t=performance.now()/1000;

  const img=speedFireFrames[Math.floor(t*12)%speedFireFrames.length];
  if(img.complete&&img.naturalWidth>0){
   const textWidth=ctx.measureText(label).width;
   const fireWidth=textWidth+32;
   const fireHeight=fireWidth*img.naturalHeight/img.naturalWidth;
   // Keep the solid flame base behind and slightly below the digits.
   const visibleHeight=Math.min(94,Math.max(42,fireHeight));

   ctx.globalAlpha=.62+heat*.38;
   ctx.drawImage(img,cx-fireWidth/2,cy+18-visibleHeight,fireWidth,visibleHeight);

  }
 }

  const width=ctx.measureText(label).width;
  const rgb=ctx.createLinearGradient(cx-width/2,0,cx+width/2,0);
  for(let i=0;i<=16;i++)rgb.addColorStop(i/16,'hsl('+(((i/16+t*.22)%1)*360)+',100%,72%)');

}

 const total=workoutHistory.reduce((n,x)=>n+(Number(x.distance)||0),0);

  const d=document.createElement('div');d.className='historyItem';
  const when=new Date(x.date);
  d.textContent=(Number.isNaN(when.getTime())?'TREINO':when.toLocaleString('pt-BR'))+' | '+Math.floor(x.seconds/60)+' MIN '+Math.round(x.seconds%60)+' S | '+(x.distance/1000).toFixed(2)+' KM | ~'+x.kcal+' KCAL | MÁX '+x.max.toFixed(1)+' KM/H';

const gameMenu=el('gameMenu'),menuToggle=el('menuToggle');
function setGameMenu(open){gameMenu.hidden=!open;menuToggle.setAttribute('aria-expanded',String(open));menuToggle.textContent=open?'✕ MENU':'☰ MENU';if(open){el('menuClose').focus()}else{menuToggle.focus()}}
menuToggle.onclick=()=>setGameMenu(gameMenu.hidden);
el('menuClose').onclick=()=>setGameMenu(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape')setGameMenu(false)});
el('historyToggle').onclick=()=>{el('historyPanel').hidden=!el('historyPanel').hidden;renderHistory();el('historyToggle').setAttribute('aria-expanded',String(!el('historyPanel').hidden))};
el('clearHistory').onclick=()=>{if(!confirm('Apagar todo o histórico de treinos?'))return;workoutHistory=[];try{localStorage.removeItem(WORKOUT_HISTORY_KEY)}catch(e){}renderHistory()};
renderHistory();
</script></body></html>
