<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#101b31"><title>PEDAL RUSH — Arcade</title><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:white;font-family:system-ui,Arial;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated;touch-action:none}#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;justify-content:space-between;pointer-events:none;font-weight:900;text-shadow:2px 3px #101827}#hud span{background:#101827c9;border:2px solid #ffcb56;padding:7px 10px;border-radius:4px;font-size:clamp(11px,2vw,17px)}#overlay{position:absolute;inset:0;display:grid;place-items:center;background:#0a1420b8;padding:18px}#panel{max-width:530px;width:100%;background:#17283c;border:5px solid #ffcb56;box-shadow:9px 9px #080f1b;padding:25px;text-align:center}h1{font-size:clamp(38px,9vw,74px);line-height:1;margin:0;color:#ffca38;text-shadow:4px 5px #b14b23,7px 8px #0b1421;letter-spacing:2px}h2{color:#ffce55}p{line-height:1.5;color:#e2e8ef}button{cursor:pointer;background:#ffbb34;border:3px solid #ffe69b;color:#192337;box-shadow:4px 4px #091422;padding:12px 16px;font-weight:1000;margin:6px;font-size:15px}button:active{transform:translate(2px,2px);box-shadow:2px 2px #091422}button.secondary{background:#243d56;color:white;border-color:#6f91a8}#controls{position:absolute;bottom:15px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}#controls button{pointer-events:auto;opacity:.93}#hint{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font-size:11px;color:#fff8;text-shadow:1px 1px black;white-space:nowrap}@media(max-height:500px){#panel{padding:12px}h1{font-size:36px}p{margin:7px}button{padding:8px}} </style></head><body>
<canvas id="game"></canvas><div id="hud"><span id="speed">0.0 KM/H</span><span id="distance">0 M</span><span id="score">★ 0</span></div><div id="overlay"><div id="panel"><h1>PEDAL<br>RUSH</h1><p>ARCADE CYCLING • BRASIL</p><p id="status">KWIKWI — DESCONECTADA</p><button id="play">▶ JOGAR</button><button id="connect" class="secondary">ᛒ CONECTAR BICICLETA</button><button id="demo" class="secondary">⌨ MODO TESTE</button><p style="font-size:12px">No modo teste, segure ESPAÇO ou ACELERAR. No modo bicicleta, basta pedalar para avançar.</p></div></div><div id="controls"><button id="accelerate">▲ ACELERAR</button><button id="pause">Ⅱ PAUSA</button></div><div id="hint">FTMS 0x1826 • Indoor Bike Data 0x2AD2</div>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');let W=960,H=540,playing=false,mode='demo',bikeSpeed=0,speed=0,meters=0,points=0,scroll=0,pressed=false,device=null,characteristic=null,last=performance.now();
function resize(){canvas.width=960;canvas.height=540;ctx.imageSmoothingEnabled=false}resize();
const el=id=>document.getElementById(id),rand=(a,b)=>a+Math.random()*(b-a);
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function text(t,x,y,size=20,color='#fff'){ctx.fillStyle='#172239';ctx.font='bold '+size+'px monospace';ctx.fillText(t,x+2,y+3);ctx.fillStyle=color;ctx.fillText(t,x,y)}
const sceneImage=new Image();sceneImage.src='Cenario.png';let sceneReady=false;sceneImage.onload=()=>sceneReady=true;function background(){if(sceneReady){const tileWidth=960*sceneImage.naturalWidth/sceneImage.naturalHeight;const offset=((scroll%tileWidth)+tileWidth)%tileWidth;for(let x=-offset;x<960;x+=tileWidth)ctx.drawImage(sceneImage,x,0,tileWidth,540);return;}rect(0,0,W,540,'#319be9');for(let i=0;i<18;i++){let x=((i*141-scroll*.08)%1250+1250)%1250-130,y=38+(i*47)%105;rect(x,y,85,17,'#e6f5ff');rect(x+18,y-12,44,16,'#f8f5dd')}
rect(0,300,960,140,'#5b9c70');for(let i=0;i<22;i++){let x=((i*74-scroll*.23)%1120+1120)%1120-90,h=80+(i*39)%140;rect(x,330-h,48,h,'#6a92ae');for(let j=0;j<3;j++)for(let k=0;k<6;k++)rect(x+7+j*13,340-h+k*21,5,8,'#f8db92')}
for(let i=0;i<14;i++){let x=((i*112-scroll*.53)%1220+1220)%1220-115;rect(x,285,104,134,['#f1b05e','#6ab9d4','#e57f68','#98c681'][i%4]);rect(x-5,277,114,12,'#a74e3f');rect(x+15,322,26,32,'#344a63');rect(x+61,315,25,50,'#394b57');rect(x,418,104,5,'#f7d8a5')}
rect(0,422,960,18,'#b9b6ac');for(let i=0;i<40;i++)rect(i*27,422,2,16,'#656b73');rect(0,440,960,100,'#414857');rect(0,445,960,3,'#687081');for(let i=0;i<12;i++){let x=((i*116-scroll*1.2)%1200+1200)%1200-110;rect(x,492,61,5,'#f7eac2')}}
const cyclistFrames=Array.from({length:4},(_,i)=>{const img=new Image();img.src='CiclistaNovo'+(i+1)+'.png';return img});let pedalPhase=0;let animationCadence=0;
function cyclist(){const index=Math.floor(pedalPhase)%4;const img=cyclistFrames[index];if(img.complete&&img.naturalWidth>0){const h=180,w=h*img.naturalWidth/img.naturalHeight;ctx.drawImage(img,205-w/2,454-h,w,h)}else{rect(170,330,70,120,'#e54b46')}}
function reset(){playing=true;speed=0;meters=0;points=0;scroll=0;pedalPhase=0;animationCadence=0;el('overlay').style.display='none'}
function end(){playing=false;el('overlay').style.display='grid';el('status').textContent='FIM DE JOGO • '+Math.round(meters)+' m • '+points+' pontos';el('play').textContent='↻ JOGAR NOVAMENTE'}
function update(dt){if(!playing)return;let target=mode==='bike'?bikeSpeed:(pressed?29:0);speed+=(target-speed)*Math.min(1,dt*3.2);scroll+=speed*dt*13;const targetCadence=speed<0.7?0:Math.min(14,Math.max(2.5,speed*.46));animationCadence+=(targetCadence-animationCadence)*Math.min(1,dt*3.8);if(animationCadence>0.1)pedalPhase=(pedalPhase+animationCadence*dt)%4;meters+=speed*dt/3.6;points=Math.floor(meters/10);el('speed').textContent=speed.toFixed(1)+' KM/H';el('distance').textContent=Math.round(meters)+' M';el('score').textContent='★ '+points}
function draw(){background();cyclist();if(!playing)rect(0,0,960,540,'#07152222')}
function frame(t){let dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
el('play').onclick=()=>{mode=device?'bike':'demo';reset()};el('demo').onclick=()=>{mode='demo';reset()};el('pause').onclick=()=>{if(playing){playing=false;el('overlay').style.display='grid';el('status').textContent='PAUSADO'}};function down(e){e.preventDefault();pressed=true}function up(){pressed=false}el('accelerate').addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(e=>el('accelerate').addEventListener(e,up));window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowRight'){pressed=true;e.preventDefault()}});window.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowRight')pressed=false});
async function connect(){try{if(!navigator.bluetooth)throw Error('Web Bluetooth indisponível neste navegador. Use Chrome com HTTPS.');el('status').textContent='PROCURANDO KWIKWI...';device=await navigator.bluetooth.requestDevice({filters:[{services:[0x1826]}],optionalServices:[0x1826]});device.addEventListener('gattserverdisconnected',()=>{device=null;bikeSpeed=0;el('status').textContent='KWIKWI — DESCONECTADA'});let server=await device.gatt.connect(),service=await server.getPrimaryService(0x1826);characteristic=await service.getCharacteristic(0x2ad2);await characteristic.startNotifications();characteristic.addEventListener('characteristicvaluechanged',e=>{let v=e.target.value;if(v.byteLength<4)return;let flags=v.getUint16(0,true);if(!(flags&1)){bikeSpeed=v.getUint16(2,true)/100}else{bikeSpeed=0}el('status').textContent='KWIKWI — '+bikeSpeed.toFixed(1)+' KM/H'});mode='bike';el('status').textContent='KWIKWI CONECTADA!';}catch(e){el('status').textContent='ERRO: '+e.message;device=null}}el('connect').onclick=connect;
</script></body></html>
