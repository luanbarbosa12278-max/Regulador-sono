<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#101b31"><title>PEDAL RUSH — Arcade</title><style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
:root{--dark:#071326;--panel:#102743;--gold:#ffce57;--cream:#fff2c5;--aqua:#77f0e9;--edge:#060e1d}
*,*:before,*:after{box-sizing:border-box;font-family:'Press Start 2P',monospace!important}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--dark);color:white}
canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated;touch-action:none}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:12;background:repeating-linear-gradient(0deg,transparent 0 3px,#06102717 3px 4px)}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:stretch;justify-content:center;gap:6px;flex-wrap:wrap;pointer-events:none;z-index:3}
#hud span{display:flex;align-items:center;justify-content:center;min-height:38px;padding:9px 11px;background:#102441ec;border:2px solid #071020;box-shadow:inset 0 2px #426180,0 3px 0 #050a14;color:#f9e7b3;font-size:clamp(8px,1vw,11px);line-height:1.5;white-space:nowrap;text-shadow:1px 2px #0b162a}

#hud #time{background:#45301e;color:#ffe2a0;border-bottom:3px solid #ffc75b}
#hud #coins{color:#ffe06d}#hud #calories{color:#ffb47b}#hud #best{color:#ffcf85}
#overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:5;padding:22px;background:radial-gradient(ellipse at 50% 40%,#122c4c9c,#040b1dea 78%);overflow-y:auto}
#panel{position:relative;width:min(100%,560px);padding:30px 27px 24px;text-align:center;background:repeating-linear-gradient(0deg,#112b4c 0 24px,#153454 24px 48px);border:5px solid #ffe0a0;outline:5px solid #0a172c;box-shadow:0 0 0 9px #ad6337,12px 13px 0 10px #040917}
#panel:before,#panel:after{content:"";position:absolute;top:12px;width:9px;height:9px;background:#ffe4a0;box-shadow:0 0 0 3px #76452a}#panel:before{left:13px}#panel:after{right:13px}
h1{font-size:clamp(28px,5vw,55px);line-height:1.38;letter-spacing:2px;margin:5px 0 10px;color:#ffe46d;text-shadow:4px 4px #ed8c40,8px 8px #873f2c,11px 11px #061326}
p{color:#d7e6ed;font-size:clamp(8px,1.1vw,10px);line-height:2;overflow-wrap:anywhere}
#panel>p:first-of-type{color:#8ef1eb;letter-spacing:1px}
#status{margin:18px auto 17px;padding:12px;background:#071c32;border:2px solid #527c91;box-shadow:inset 0 2px #102d47;color:#ffe6a3;font-size:clamp(8px,1vw,10px);line-height:1.8}
button{appearance:none;cursor:pointer;background:#ffcb4e;color:#17223a;border:3px solid #10192b;border-top-color:#fff0b0;border-left-color:#fff0b0;box-shadow:4px 4px #030a16;padding:12px 14px;margin:4px;font-size:clamp(8px,1vw,10px);line-height:1.6;transition:transform .1s,filter .1s,box-shadow .1s;touch-action:manipulation}
button:hover{filter:brightness(1.13)}button:active{transform:translate(3px,3px);box-shadow:1px 1px #030a16}button:focus-visible,select:focus-visible{outline:3px dashed #76f5e9;outline-offset:3px}
button.secondary{background:#2b5773;color:#fff4d2;border-top-color:#91e5e8;border-left-color:#91e5e8}
#play{display:block;width:min(92%,355px);margin:12px auto 10px;padding:15px;background:#ffd35b;font-size:clamp(10px,1.4vw,13px);animation:arcadePulse 2s steps(2,end) infinite}
#connect,#demo{width:min(92%,355px);display:block;margin:9px auto}
#sound{position:absolute;top:70px;right:13px;z-index:6;font-size:8px;padding:9px}
#finish{position:absolute;right:14px;bottom:96px;z-index:4;font-size:8px;padding:10px}
#finish[hidden]{display:none}
#effortBox{position:absolute;bottom:85px;left:50%;transform:translateX(-50%);z-index:7;background:#102441ef;border:2px solid #f3c56d;box-shadow:4px 4px #07101e;padding:7px 9px;display:flex;align-items:center;gap:8px;font-size:8px;color:#ffe4a5;white-space:nowrap}

#effort option{background:#102a46;color:#fff}

#controls button{pointer-events:auto;opacity:.94;font-size:9px}
#accelerate{background:#ffc950}#pause{background:#2b5773;color:#fff4d2;border-top-color:#91e5e8;border-left-color:#91e5e8}

@keyframes arcadePulse{50%{filter:brightness(1.14)}}
@media(max-width:700px){#hud{top:7px;left:5px;right:5px;gap:4px}#hud span{font-size:7px;min-height:28px;padding:6px 7px}#sound{top:auto;bottom:139px;right:7px}#finish{right:7px;bottom:91px}#effortBox{bottom:81px;left:8px;transform:none;font-size:7px;padding:6px;gap:4px}#effort{min-width:100px;max-width:130px;font-size:7px;padding:7px 3px}#controls{padding:0 6px;bottom:9px}#controls button{font-size:8px;padding:9px 7px}#hint{display:none}#panel{padding:22px 13px 18px;border-width:4px;outline-width:3px;box-shadow:0 0 0 6px #ad6337,7px 8px 0 7px #040917}}
@media(max-width:390px){#hud span{font-size:6px;padding:5px}#effortBox{bottom:77px}#sound{bottom:130px}}
@media(max-height:570px){#panel{padding:12px 14px}h1{font-size:clamp(22px,6vh,37px);line-height:1.22;margin:0 0 5px}#panel p{margin:6px auto;font-size:8px}#status{margin:7px auto;padding:7px}#play{margin:6px auto;padding:9px}#connect,#demo{margin:4px auto;padding:7px}#overlay{padding:10px}}
@media(prefers-reduced-motion:reduce){#play{animation:none}}

</style></head><body>
<canvas id="game"></canvas><div id="hud"><span id="speed">0.0 KM/H</span><span id="distance">0 M</span><span id="score">★ 0</span><span id="coins">🪙 0</span><span id="best">🏆 0 M</span><span id="time">⏱ 0:00</span><span id="calories" title="Estimativa de calorias, não medição">🔥 ~0 KCAL</span></div><div id="overlay"><div id="panel"><h1>PEDAL<br>RUSH</h1><p>ARCADE CYCLING • BRASIL</p><p id="status">KWIKWI — DESCONECTADA</p><button id="play">▶ JOGAR</button><button id="connect" class="secondary">ᛒ CONECTAR BICICLETA</button><button id="demo" class="secondary">⌨ MODO TESTE</button><p style="font-size:12px">No modo teste, segure ESPAÇO ou ACELERAR. No modo bicicleta, basta pedalar para avançar.</p></div></div><button id="sound" class="secondary" aria-label="Alternar efeitos sonoros" aria-pressed="true">♪ SOM ON</button><button id="finish" class="secondary" hidden>✓ FINALIZAR TREINO</button><label id="effortBox" for="effort">⚙ ESFORÇO <select id="effort" aria-label="Esforço percebido"><option value="0">MUITO LEVE</option><option value="1">LEVE</option><option value="2" selected>MÉDIO</option><option value="3">PESADO</option><option value="4">MUITO PESADO</option></select></label><div id="controls"><button id="accelerate">▲ ACELERAR</button><button id="pause">Ⅱ PAUSA</button></div><div id="hint">FTMS 0x1826 • Indoor Bike Data 0x2AD2</div>
<script>
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');let W=960,H=540,playing=false,mode='demo',bikeSpeed=0,speed=0,meters=0,points=0,scroll=0,pressed=false,device=null,characteristic=null,last=performance.now();
function resize(){canvas.width=960;canvas.height=540;ctx.imageSmoothingEnabled=false}resize();
const el=id=>document.getElementById(id),rand=(a,b)=>a+Math.random()*(b-a);
let audioCtx=null,soundEnabled=true,lastCoinSound=-1;
try{soundEnabled=localStorage.getItem('pedal-rush-sound')!=='off'}catch(e){}
function updateSoundButton(){el('sound').textContent=soundEnabled?'♪ SOM ON':'♪ SOM OFF';el('sound').setAttribute('aria-pressed',String(soundEnabled))}
function unlockAudio(){if(!soundEnabled)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{})}catch(e){}}
function note(freq,duration=.09,type='square',volume=.055,delay=0,slide=1){if(!soundEnabled||!audioCtx||audioCtx.state!=='running')return;const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(slide!==1)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide),t+duration);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+duration+.01)}
function sfx(kind){if(!soundEnabled)return;if(kind==='coin'){if(audioCtx&&audioCtx.currentTime-lastCoinSound<.055)return;lastCoinSound=audioCtx?.currentTime??-1;note(880,.065,'square',.035);note(1320,.12,'square',.035,.065)}else if(kind==='start'){note(392,.1,'square',.04);note(523,.1,'square',.04,.11);note(784,.2,'square',.045,.22)}else if(kind==='finish'){note(784,.11,'triangle',.06);note(659,.11,'triangle',.06,.12);note(523,.25,'triangle',.06,.24)}else if(kind==='record'){[523,659,784,1047].forEach((f,i)=>note(f,.15,'square',.04,i*.095))}else if(kind==='goal'){[440,554,659,880,1047].forEach((f,i)=>note(f,.16,'triangle',.055,i*.09))}else if(kind==='click'){note(520,.045,'square',.022)}else if(kind==='pause'){note(330,.1,'triangle',.04)}}updateSoundButton();
el('sound').onclick=()=>{soundEnabled=!soundEnabled;try{localStorage.setItem('pedal-rush-sound',soundEnabled?'on':'off')}catch(e){}updateSoundButton();if(soundEnabled){unlockAudio();sfx('click')}};

function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function text(t,x,y,size=20,color='#fff'){ctx.fillStyle='#172239';ctx.font=size+"px 'Press Start 2P', monospace";ctx.fillText(t,x+2,y+3);ctx.fillStyle=color;ctx.fillText(t,x,y)}
const sceneImage=new Image();sceneImage.src='Cenario.png';let sceneReady=false;sceneImage.onload=()=>sceneReady=true;function background(){if(sceneReady){const tileWidth=960*sceneImage.naturalWidth/sceneImage.naturalHeight;const offset=((scroll%tileWidth)+tileWidth)%tileWidth;for(let x=-offset;x<960;x+=tileWidth)ctx.drawImage(sceneImage,x,0,tileWidth,540);return;}rect(0,0,W,540,'#319be9');for(let i=0;i<18;i++){let x=((i*141-scroll*.08)%1250+1250)%1250-130,y=38+(i*47)%105;rect(x,y,85,17,'#e6f5ff');rect(x+18,y-12,44,16,'#f8f5dd')}
rect(0,300,960,140,'#5b9c70');for(let i=0;i<22;i++){let x=((i*74-scroll*.23)%1120+1120)%1120-90,h=80+(i*39)%140;rect(x,330-h,48,h,'#6a92ae');for(let j=0;j<3;j++)for(let k=0;k<6;k++)rect(x+7+j*13,340-h+k*21,5,8,'#f8db92')}
for(let i=0;i<14;i++){let x=((i*112-scroll*.53)%1220+1220)%1220-115;rect(x,285,104,134,['#f1b05e','#6ab9d4','#e57f68','#98c681'][i%4]);rect(x-5,277,114,12,'#a74e3f');rect(x+15,322,26,32,'#344a63');rect(x+61,315,25,50,'#394b57');rect(x,418,104,5,'#f7d8a5')}
rect(0,422,960,18,'#b9b6ac');for(let i=0;i<40;i++)rect(i*27,422,2,16,'#656b73');rect(0,440,960,100,'#414857');rect(0,445,960,3,'#687081');for(let i=0;i<12;i++){let x=((i*116-scroll*1.2)%1200+1200)%1200-110;rect(x,492,61,5,'#f7eac2')}}
const cyclistFrames=Array.from({length:4},(_,i)=>{const img=new Image();img.src='CiclistaNovo'+(i+1)+'.png';return img});let pedalPhase=0;let animationCadence=0;const STORAGE_KEY='pedal-rush-progress-v1';let progress={coins:0,best:0};try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');progress.coins=Math.max(0,Math.floor(Number(saved.coins)||0));progress.best=Math.max(0,Number(saved.best)||0)}catch(e){}let calories=0;const CALORIE_WEIGHT_KG=70;const EFFORT_MET=[3,4,5.5,7,8.5];let effortLevel=2,lastBikeDataAt=0;try{const saved=Number(localStorage.getItem('pedal-rush-effort'));if(Number.isInteger(saved)&&saved>=0&&saved<=4)effortLevel=saved}catch(e){}el('effort').value=String(effortLevel);el('effort').onchange=()=>{effortLevel=Number(el('effort').value);try{localStorage.setItem('pedal-rush-effort',String(effortLevel))}catch(e){}sfx('click')};let elapsed=0,earnedDistance=0,recordAwarded=false,goalAwarded=false,sessionBest=0,startingBest=0;function saveProgress(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(progress))}catch(e){}}function refreshRewards(){el('coins').textContent='🪙 '+progress.coins;el('best').textContent='🏆 '+Math.round(progress.best)+' M';el('time').textContent='⏱ '+Math.floor(elapsed/60)+':'+String(Math.floor(elapsed%60)).padStart(2,'0');el('calories').textContent='🔥 ~'+Math.round(calories)+' KCAL'}refreshRewards();
let roadCoins=[],nextCoinAt=360,coinEffects=[],coinClock=0;
const coinFrames=Array.from({length:4},(_,i)=>{const img=new Image();img.src='Moeda'+(i+1)+'.png';return img});
function spawnRoadCoins(){while(nextCoinAt<scroll+1250){roadCoins.push({x:nextCoinAt,seed:Math.random()*6.28,taken:false});nextCoinAt+=240+Math.random()*170}}
function burstCoin(x,y){const particles=[];for(let i=0;i<12;i++){const a=i*Math.PI/6,v=75+Math.random()*100;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-30,life:.48+Math.random()*.22,size:2+Math.floor(Math.random()*3)})}coinEffects.push({particles,x,y,life:.85})}
function updateRoadCoins(dt){coinClock+=dt;spawnRoadCoins();for(const coin of roadCoins){const x=coin.x-scroll;if(!coin.taken&&x<230&&x>185&&speed>.7){coin.taken=true;burstCoin(x,400);sfx('coin');if(mode==='bike'){progress.coins++;saveProgress()}}}roadCoins=roadCoins.filter(c=>!c.taken&&c.x-scroll>-70);for(const effect of coinEffects){effect.life-=dt;for(const p of effect.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.life-=dt}}coinEffects=coinEffects.filter(e=>e.life>0)}
function drawRoadCoins(){const frame=Math.floor(coinClock*9)%4;for(const coin of roadCoins){const x=Math.round(coin.x-scroll);if(x<-45||x>1005)continue;const y=Math.round(400+Math.sin(coinClock*5+coin.seed)*5);const twinkle=Math.sin(coinClock*7+coin.seed);ctx.fillStyle='#432a1855';ctx.fillRect(x-18,433,36,4);ctx.fillStyle='#f7a82c';ctx.fillRect(x-24,y-1,5,3);ctx.fillRect(x+20,y+2,4,3);ctx.fillStyle='#fff4a6';if(twinkle>.2){ctx.fillRect(x-26,y-12,3,10);ctx.fillRect(x-30,y-8,11,3);ctx.fillRect(x+22,y+13,3,7);ctx.fillRect(x+20,y+15,7,3)}const img=coinFrames[frame];const pulse=1+Math.sin(coinClock*8+coin.seed)*.045;const size=Math.round(45*pulse);if(img.complete&&img.naturalWidth>0){ctx.drawImage(img,x-Math.floor(size/2),y-Math.floor(size/2),size,size)}else{ctx.fillStyle='#6c3c16';ctx.fillRect(x-19,y-20,38,40);ctx.fillStyle='#ffcc40';ctx.fillRect(x-16,y-17,32,34);ctx.fillStyle='#fff2a4';ctx.fillRect(x-4,y-11,8,22)}}for(const e of coinEffects){for(const p of e.particles){if(p.life<=0)continue;ctx.fillStyle=p.life>.3?'#ffe777':'#ef9336';ctx.fillRect(Math.round(p.x),Math.round(p.y),p.size,p.size)}const rise=(.85-e.life)*58;const alpha=Math.max(0,Math.min(1,e.life/.4));ctx.save();ctx.globalAlpha=alpha;text('+1',Math.round(e.x+15),Math.round(e.y-38-rise),17,'#ffe873');ctx.restore()}}
function cyclist(){const index=Math.floor(pedalPhase)%4;const img=cyclistFrames[index];if(img.complete&&img.naturalWidth>0){const h=245,w=h*img.naturalWidth/img.naturalHeight;ctx.drawImage(img,220-w/2,465-h,w,h)}else{rect(170,330,70,120,'#e54b46')}}
function reset(){unlockAudio();sfx('start');playing=true;speed=0;meters=0;points=0;scroll=0;pedalPhase=0;animationCadence=0;elapsed=0;calories=0;earnedDistance=0;recordAwarded=false;goalAwarded=false;startingBest=progress.best;sessionBest=0;roadCoins=[];nextCoinAt=360;coinEffects=[];coinClock=0;el('finish').hidden=false;el('overlay').style.display='none';refreshRewards()}
function end(){if(!playing)return;sfx('finish');playing=false;el('finish').hidden=true;el('overlay').style.display='grid';el('status').textContent='TREINO FINALIZADO • '+Math.round(meters)+' m • '+Math.floor(elapsed/60)+' min • ~'+Math.round(calories)+' kcal estimadas • '+(mode='bike'?'🪙 '+progress.coins+' moedas totais':'MODO TESTE (SEM RECOMPENSAS)');el('play').textContent='↻ NOVO TREINO';saveProgress()}
function update(dt){if(!playing)return;const activelyPedaling=mode==='bike'?(!!device&&bikeSpeed>1&&performance.now()-lastBikeDataAt<5000):pressed;let target=mode==='bike'?(activelyPedaling?bikeSpeed:0):(pressed?29:0);speed+=(target-speed)*Math.min(1,dt*3.2);scroll+=speed*dt*13;updateRoadCoins(dt);const targetCadence=speed<0.7?0:Math.min(14,Math.max(2.5,speed*.46));animationCadence+=(targetCadence-animationCadence)*Math.min(1,dt*3.8);if(animationCadence>0.1)pedalPhase=(pedalPhase+animationCadence*dt)%4;const moved=speed*dt/3.6;meters+=moved;if(activelyPedaling)elapsed+=dt;points=Math.floor(meters/10);if(mode==='bike'&&activelyPedaling){const intensityMET=EFFORT_MET[effortLevel];calories+=Math.max(0,intensityMET-1)*3.5*CALORIE_WEIGHT_KG/200*dt/60}if(mode==='bike'){const totalDistanceCoins=Math.floor(meters/100);if(totalDistanceCoins>earnedDistance){progress.coins+=totalDistanceCoins-earnedDistance;earnedDistance=totalDistanceCoins;saveProgress()}if(meters>progress.best){progress.best=meters;saveProgress()}if(!recordAwarded&&meters>=startingBest+100&&meters>=100){recordAwarded=true;progress.coins+=25;sfx('record');saveProgress()}if(!goalAwarded&&elapsed>=600){goalAwarded=true;progress.coins+=50;sfx('goal');saveProgress()}}refreshRewards();el('speed').textContent=speed.toFixed(1)+' KM/H';el('distance').textContent=Math.round(meters)+' M';el('score').textContent='★ '+points}
function draw(){background();drawRoadCoins();cyclist();if(!playing)rect(0,0,960,540,'#07152222')}
function frame(t){let dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
el('play').onclick=()=>{mode=device?'bike':'demo';reset()};el('demo').onclick=()=>{mode='demo';reset()};el('pause').onclick=()=>{if(playing){sfx('pause');playing=false;el('finish').hidden=true;el('overlay').style.display='grid';el('status').textContent='PAUSADO • clique JOGAR para iniciar novo treino'}};el('finish').onclick=end;function down(e){e.preventDefault();pressed=true}function up(){pressed=false}el('accelerate').addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(e=>el('accelerate').addEventListener(e,up));window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowRight'){pressed=true;e.preventDefault()}});window.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowRight')pressed=false});
async function connect(){unlockAudio();sfx('click');try{if(!navigator.bluetooth)throw Error('Web Bluetooth indisponível neste navegador. Use Chrome com HTTPS.');el('status').textContent='PROCURANDO KWIKWI...';device=await navigator.bluetooth.requestDevice({filters:[{services:[0x1826]}],optionalServices:[0x1826]});device.addEventListener('gattserverdisconnected',()=>{device=null;bikeSpeed=0;lastBikeDataAt=0;el('status').textContent='KWIKWI — DESCONECTADA'});let server=await device.gatt.connect(),service=await server.getPrimaryService(0x1826);characteristic=await service.getCharacteristic(0x2ad2);await characteristic.startNotifications();characteristic.addEventListener('characteristicvaluechanged',e=>{let v=e.target.value;if(v.byteLength<4)return;let flags=v.getUint16(0,true);if(!(flags&1)){bikeSpeed=v.getUint16(2,true)/100;lastBikeDataAt=performance.now()}else{bikeSpeed=0;lastBikeDataAt=performance.now()}el('status').textContent='KWIKWI — '+bikeSpeed.toFixed(1)+' KM/H'});mode='bike';el('status').textContent='KWIKWI CONECTADA!';}catch(e){el('status').textContent='ERRO: '+e.message;device=null}}el('connect').onclick=connect;
</script></body></html>
